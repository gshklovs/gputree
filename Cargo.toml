[package]
name = "gputree"
version = "0.1.0"
edition = "2024"
description = "A disktree-style tree of what is using your GPUs on Windows (incl. WSL2), with a plain-English headline"
license = "MIT"
readme = "README.md"

[dependencies]
crossterm = { version = "0.29.0", default-features = false, features = ["windows"] }
nvml-wrapper = "0.13.0"
regex = { version = "1.13.1", default-features = false, features = ["std", "perf", "unicode-perl", "unicode-case"] }
serde_json = "1.0.151"
unicode-width = "0.2.2"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Performance",
    "Win32_System_Registry",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_System_SystemInformation",
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
